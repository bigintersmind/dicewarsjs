name: Validate Community Bots

# Untrusted half of the split validation pipeline (#142).
#
# This workflow EXECUTES PR-supplied bot code, so it runs under the fork-safe
# `pull_request` event: a read-only GITHUB_TOKEN and no secrets. The PR comment
# (which needs `pull-requests: write`) is posted by validate-bots-comment.yml,
# a `workflow_run` workflow that never checks out or runs PR code.
on:
  pull_request:
    paths:
      - 'community-bots/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate community bots
        id: validate
        # Explicit `shell: bash` enables pipefail, so the validator's exit code
        # survives the pipe into tee (the default `bash -e {0}` shell would
        # report tee's exit code and mark failed validation as success).
        shell: bash
        run: node scripts/validate-community-bots.mjs 2>&1 | tee validation-output.txt

      - name: Record validation outcome
        if: always()
        run: echo "${{ steps.validate.outcome }}" > validation-outcome.txt

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-validation-results
          path: |
            validation-output.txt
            validation-outcome.txt
