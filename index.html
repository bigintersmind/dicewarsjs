<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Dice Wars - A strategic dice game" />
    <title>DICEWARS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="apple-touch-icon-precomposed" href="https://www.gamedesign.jp/img/icon.png" />
    <link rel="shortcut icon" href="https://www.gamedesign.jp/img/favicon.ico" />

    <link
      href="https://fonts.googleapis.com/css?family=Anton|Roboto&display=swap"
      rel="stylesheet"
      type="text/css"
    />

    <style>
      /*
       * Default (dark) theme variables for first paint, before main.jsx runs.
       * applyThemeVars() overrides these on the document root at startup based
       * on the saved preference. Keep in sync with THEMES.dark in
       * src/renderer/themes.js.
       */
      :root {
        --ui-bg: rgba(0, 0, 0, 0.5);
        --ui-overlay-bg: rgba(0, 0, 0, 0.75);
        --ui-text: #ffffff;
        --ui-text-muted: #aaaaaa;
        --ui-accent: #e94560;
        --ui-accent-soft: rgba(233, 69, 96, 0.15);
        --ui-border: #555555;
        --ui-body-bg: #1a1a2e;
        --ui-scrim: rgba(16, 16, 32, 0.68);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ui-body-bg);
      }
      #pixi-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #app {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="pixi-canvas"></canvas>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
