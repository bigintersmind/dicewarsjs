<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Dice Wars: a strategic dice game" />
    <title>DICEWARS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Icons: the orange die from the title logo. public/favicon.svg is the
      source (the die extracted from src/ui/titleArt.jsx, set upright); the
      .ico (16/32/48) and touch-icon PNG were rendered from it. The .ico
      carries `sizes` so browsers that understand SVG icons prefer the vector.
      The touch icon sits on the game's body background (see themes.js
      `bodyBg` / --ui-body-bg below) because iOS paints transparency black.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      href="https://fonts.googleapis.com/css?family=Anton|Roboto&display=swap"
      rel="stylesheet"
      type="text/css"
    />

    <style>
      /*
       * Default (dark) theme variables for first paint, before main.jsx runs.
       * applyThemeVars() overrides these on the document root at startup based
       * on the saved preference. Keep in sync with THEMES.dark in
       * src/renderer/themes.js.
       */
      :root {
        --ui-bg: rgba(0, 0, 0, 0.5);
        --ui-overlay-bg: rgba(0, 0, 0, 0.75);
        --ui-text: #ffffff;
        --ui-text-muted: #c9c9d6;
        --ui-accent: #e94560;
        --ui-accent-soft: rgba(233, 69, 96, 0.15);
        --ui-bevel-face: #ff9c00;
        --ui-bevel-face-display: #ff9c00;
        --ui-bevel-shadow: 1px 1px 0 #875300, 2px 2px 0 #4a2d00, 1px 3px 6px rgba(0, 0, 0, 0.35);
        --ui-bevel-shadow-display:
          -2px -2px 0 #ffff33, 2px 2px 0 #c57900, 3px 3px 0 #875300, 5px 5px 0 #4a2d00,
          4px 9px 16px rgba(0, 0, 0, 0.4);
        --ui-border: #555555;
        --ui-body-bg: #1a1a2e;
        --ui-scrim: rgba(16, 16, 32, 0.68);
        --ui-text-halo:
          0 1px 2px rgba(13, 13, 26, 0.92), 0 -1px 2px rgba(13, 13, 26, 0.92),
          1px 0 2px rgba(13, 13, 26, 0.92), -1px 0 2px rgba(13, 13, 26, 0.92),
          0 2px 6px rgba(0, 0, 0, 0.55);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ui-body-bg);
      }
      #pixi-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #app {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="pixi-canvas"></canvas>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
