name: Comment Bot Validation Results

# Privileged half of the split validation pipeline (#142).
#
# Holds the `pull-requests: write` token but never checks out or executes PR
# code — it only relays the artifact produced by the untrusted run in
# validate-bots.yml. The artifact contents are attacker-controlled (the PR's
# own code runs in the workflow that produces them), so they must only ever be
# rendered as comment text — never used as commands, paths, or API parameters.
# In particular the target PR is resolved from the run's head SHA, not from
# anything inside the artifact.
on:
  workflow_run:
    workflows: ['Validate Community Bots']
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download validation artifact
        id: download
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = data.artifacts.find(a => a.name === 'bot-validation-results');
            if (!artifact) {
              core.setOutput('found', 'false');
              core.warning('No bot-validation-results artifact on the triggering run.');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            require('fs').writeFileSync('results.zip', Buffer.from(download.data));
            core.setOutput('found', 'true');

      - name: Unzip artifact
        if: steps.download.outputs.found == 'true'
        run: unzip -o results.zip -d results

      - name: Comment validation results on PR
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;

            // Resolve the PR from the run's head SHA — never from artifact
            // contents, which the PR's own code can forge.
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: run.head_sha,
            });
            const pr = prs.find(p => p.head.sha === run.head_sha) ?? run.pull_requests[0];
            if (!pr) {
              core.info(`No PR found for head SHA ${run.head_sha}; skipping comment.`);
              return;
            }

            const readIfExists = f => (fs.existsSync(f) ? fs.readFileSync(f, 'utf-8') : null);
            const outcome = (readIfExists('results/validation-outcome.txt') ?? '').trim();
            const passed = run.conclusion === 'success' && outcome === 'success';
            let output =
              readIfExists('results/validation-output.txt') ??
              '(no validation output — the validation run failed before producing results; see the workflow logs)';
            const MAX = 60000; // stay under the 65536-char comment limit incl. wrapper
            if (output.length > MAX) {
              output = `${output.slice(0, MAX)}\n… (truncated — full output in the workflow run)`;
            }

            const icon = passed ? ':white_check_mark:' : ':x:';
            const body = [
              `## ${icon} Bot Validation ${passed ? 'Passed' : 'Failed'}`,
              '',
              '```',
              output,
              '```',
              '',
              `[Full validation run](${run.html_url})`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
