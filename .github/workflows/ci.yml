name: CI

on:
  push:
    branches: [master]
    # The daily tournament pushes generated data to master; no need to re-run
    # the full suite for those data-only commits (Deploy still fires).
    paths-ignore:
      - 'public/data/**'
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Run benchmarks
        run: npm run test:benchmark

      # PPO env-server transport smokes (ml-bot Phase 3). Each forks the Node env-server
      # + a live socket — pure Node, no Python/torch — so they belong here (the Python
      # `ML CI` job has no `node`). Fast + deterministic; bash errexit fails the step on
      # the first non-zero exit. booking-smoke guards the B2 "book before the zero-decision
      # wire gate" reordering, which no vitest test covers (the book is internal Node state).
      # shaped-smoke runs the real main() under --reward-shaping=1 (bite G / issue #84): the
      # hermetic vitest test pins the extracted makeShapedEmission glue, but only this live run
      # exercises main()'s WIRING of it (per-episode reset(), the shaped-tail emission) in CI.
      - name: PPO env-server smoke checks
        run: |
          npm run ppo:env-smoke
          npm run ppo:disconnect-smoke
          npm run ppo:booking-smoke
          npm run ppo:shaped-smoke

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7
