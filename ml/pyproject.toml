[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicewars-bc"
version = "0.1.0"
description = "Behavioral-cloning trainer for the DiceWarsJS ml-bot (Phase 2): clone ai_lookahead from packed self-play tensors → ONNX."
readme = "README.md"
requires-python = ">=3.10"
# Pinned loosely; install the CUDA build of torch on the GPU box (see README).
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
onnx = [
  "onnx>=1.15",
  "onnxruntime>=1.17",
]
# Phase-3 self-play PPO (dicewars_ppo). Installed on the GPU box (shodan/WSL);
# NOT needed for the BC trainer or its hermetic tests. gymnasium is the env API;
# stable-baselines3 + sb3-contrib provide PPO + action masking (MaskablePPO);
# pettingzoo is listed for the multi-agent reference utilities (the env itself is
# single-agent — opponents run in-process in Node; see dicewars_ppo/__init__.py).
rl = [
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "sb3-contrib>=2.3",
  "pettingzoo>=1.24",
  # train.py's TensorBoard sink. SB3's TensorBoardOutputFormat HARD-imports this (it RAISES, not
  # no-ops, when the TB sink is enabled and tensorboard is absent), so it lives in [rl] (the GPU
  # box). train.py also degrades to CSV-only + a warning if it's missing (--no-tensorboard opts
  # out entirely). The lean ml-test CI never installs [rl] / calls _make_logger, so no CI change.
  "tensorboard>=2.12",
]
dev = [
  "pytest>=7.4",
  # Pinned exact so the lint gate is reproducible: an unpinned ruff adds/retires
  # rules on new releases and would break CI with no code change. Bump deliberately.
  "ruff==0.15.18",
]

[project.scripts]
# Convenience entry points once `pip install -e .` is run.
dicewars-bc-train = "dicewars_bc.train:main"
dicewars-bc-export = "dicewars_bc.export_onnx:main"

[tool.setuptools]
packages = ["dicewars_bc", "dicewars_ppo"]

[tool.pytest.ini_options]
# Make `dicewars_bc` importable when running `pytest` from ml/ without installing.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
